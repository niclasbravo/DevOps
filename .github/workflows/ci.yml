name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Evita corridas duplicadas: una nueva en la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Build y pruebas (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Revisar estilo (ruff)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: backend

      - name: Verificar que la app carga
        run: python -c "from app.main import app; print('App cargada:', app.title)"

      - name: Correr pruebas
        run: pytest -v --junitxml=test-results.xml

      - name: Resumen de pruebas
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("test-results.xml").getroot()
          s = root if root.tag == "testsuite" else root.find("testsuite")
          total, fail, err, skip = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print("## Resultado de pruebas")
          print(f"| Total | Pasaron | Fallaron | Errores | Omitidas | Tiempo |")
          print(f"|---|---|---|---|---|---|")
          print(f"| {total} | {total-fail-err-skip} | {fail} | {err} | {skip} | {float(s.get('time', 0)):.2f}s |")
          EOF

  notificar:
    name: Avisar a Discord
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Enviar resultado del CI
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.tests.result }}
          title: "CI GameMatch"
          description: "${{ github.event_name }} en ${{ github.ref_name }} por ${{ github.actor }}"
